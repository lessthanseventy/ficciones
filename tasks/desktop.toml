# tasks/desktop.toml — the desktop: shell, screenshots, theme, VM, home-manager, flake. Included by mise.toml ([task_config] includes);
# each top-level table is a task. `mise tasks` lists them all.

# The one palette (modules/desktop/theme/palette.nix → palettes/<current>.nix) → the checked-in shell scss/ts.
["theme:gen"]
description = "theme: rewrite the palette-generated files in the repo from palette.nix (checks.palette-sync fails the flake when they drift)"
run = "scripts/theme-gen.sh"

# Andrew has low vision: contrast.nix declares the floor for every pair the machine paints.
["theme:contrast"]
description = "theme: check BOTH palettes against the WCAG floors in contrast.nix (same check as flake's palette-contrast, with the full table printed)"
run = "nix build --no-link --print-build-logs .#checks.x86_64-linux.palette-contrast"

["flake:bump"]
description = "machine: nix flake update — every input, Expert included (it builds from its own flake)"
run = "nix flake update"

["flake:check"]
description = "machine: nix flake check + build both closures — the machine-level gate"
# `nix flake check` only EVALUATES; it never builds. A bash syntax error in a home.activation
# block sails through it and explodes at home:switch; a broken derivation in the laptop's closure
# sails through it and explodes on the install ISO, where there is no shell to fix it from.
# Building both is what actually catches them. (ivysaur added 2026-09-12 — until then the
# runbook's gate was prose no task ran, and nothing had ever built that closure.)
run = [
  "nix flake check",
  "nix build --no-link .#homeConfigurations.personalbox.activationPackage",
  "nix build --no-link .#nixosConfigurations.ivysaur.config.system.build.toplevel",
]

["hyprlock:preview"]
description = "theme: photograph the generated hyprlock.conf in a nested Hyprland, per palette — hyprlock has no dry-run and a bad lock config is found while locked out"
run = "scripts/hyprlock-preview.sh"

["ivysaur:build"]
description = "machine: build the laptop's NixOS system closure to .dev/ivysaur — the runbook's install gate"
run = "nix build .#nixosConfigurations.ivysaur.config.system.build.toplevel -o .dev/ivysaur"

# The NixOS VM — the laptop's configuration booted under QEMU with this working tree shared in
# at its real path (modules/os/vm.nix). KVM + virtio-gpu GL; the window is a Hyprland session
# logged in as andrew. Ctrl+Alt+G releases the pointer.
["vm:build"]
description = "machine: build the NixOS VM runner from nixosConfigurations.vm"
run = "nix build .#nixosConfigurations.vm.config.system.build.vm -o .dev/vm"

["vm:run"]
description = "machine: boot the VM (vm:build first); disk state lives in .dev/vm.qcow2"
depends = ["vm:build"]
run = "cd .dev && NIX_DISK_IMAGE=vm.qcow2 ./vm/bin/run-vm-vm"

["vm:ssh"]
description = "machine: ssh into the running VM as andrew (password andrew); pass a command to run it"
run = "ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null andrew@localhost"

# The desktop shell (modules/desktop/shell). `ags` on PATH comes from home:switch (the same
# build the package used), so the dev loop and the store package see one Astal.
["shell:dev"]
description = "shell: run the shell from source (Ctrl+C stops it); pkill -x gjs first — the dbus name is taken while the installed shell runs"
dir = "modules/desktop/shell"
run = "export ASTAL_SHELL_DEV=1; if command -v nix-gpu >/dev/null; then exec nix-gpu ags run app.tsx; fi; echo 'shell:dev — no nix-gpu yet (home:switch): drawing in software'; exec ags run app.tsx"

# Silent screenshots for an agent's eyes (no flameshot UI): a PNG under ~/Pictures/Screenshots,
# its path on stdout — Read it. `shot:window` matches class or title (regex, case-insensitive)
# and takes the first mapped hit; no arg = the focused window. Andrew's own captures are the
# rail's card / Print keys (flameshot).
["shot:monitor"]
description = "desktop: grim the focused monitor to ~/Pictures/Screenshots, print the path"
run = '''
set -euo pipefail
d="$HOME/Pictures/Screenshots"; mkdir -p "$d"
m=$(hyprctl monitors -j | jq -r '.[] | select(.focused) | .name')
f="$d/$(date +%Y-%m-%d_%H.%M.%S)_monitor-$m.png"
grim -o "$m" "$f" && echo "$f"
'''

["shot:window"]
description = "desktop: grim one window (arg: class/title regex; none = focused) to ~/Pictures/Screenshots, print the path"
run = '''
set -euo pipefail
d="$HOME/Pictures/Screenshots"; mkdir -p "$d"
re={{arg(name="match", default="")}}
if [ -n "$re" ]; then
  c=$(hyprctl clients -j | jq -c --arg re "$re" '[.[] | select(.mapped and ((.class|test($re;"i")) or (.title|test($re;"i"))))][0]')
else
  c=$(hyprctl activewindow -j)
fi
[ "$c" != "null" ] && [ -n "$c" ] || { echo "no window matches ${re:-<focused>}" >&2; exit 1; }
g=$(jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"' <<<"$c")
n=$(jq -r '.class' <<<"$c" | tr -c 'A-Za-z0-9.' '_')
f="$d/$(date +%Y-%m-%d_%H.%M.%S)_window-$n.png"
grim -g "$g" "$f" && echo "$f"
'''

["shot:layer"]
description = "desktop: grim ONE of the shell's layer surfaces on the focused monitor (arg: rail|bar|deck|backdrop, or any namespace substring; default bar). The shell draws in LAYERS, not windows, so shot:window cannot see it and shot:monitor makes you crop by hand."
run = '''
set -euo pipefail
d="$HOME/Pictures/Screenshots"; mkdir -p "$d"
q={{arg(name="layer", default="bar")}}
m=$(hyprctl monitors -j | jq -r '.[] | select(.focused) | .name')
# layer x/y are already global compositor coords, which is what grim -g wants
g=$(hyprctl layers -j | jq -r --arg m "$m" --arg q "$q" '.[$m].levels | to_entries[].value[] | select(.namespace | test($q;"i")) | "\(.x),\(.y) \(.w)x\(.h)"' | head -1)
[ -n "$g" ] || { echo "no layer matching '$q' on $m — try: $(hyprctl layers -j | jq -r --arg m "$m" '[.[$m].levels | to_entries[].value[].namespace] | join(\", \")')" >&2; exit 1; }
f="$d/$(date +%Y-%m-%d_%H.%M.%S)_layer-$q.png"
grim -g "$g" "$f" && echo "$f"
'''

["shot:region"]
description = "desktop: grim an arbitrary rectangle in global compositor coords (arg: 'X,Y WxH', e.g. '1920,40 48x280') — the escape hatch when the thing you want is not a window or a layer"
run = '''
set -euo pipefail
g={{arg(name="geometry")}}
[ -n "$g" ] || { echo "usage: mise run shot:region -- 'X,Y WxH'" >&2; exit 2; }
d="$HOME/Pictures/Screenshots"; mkdir -p "$d"
f="$d/$(date +%Y-%m-%d_%H.%M.%S)_region.png"
grim -g "$g" "$f" && echo "$f"
'''

["shell:check"]
description = "shell: the gate — ags bundle (syntax + imports + scss), tsc over our files, then the node tests; all hard-fail"
dir = "modules/desktop/shell"
# ags 3.1's own lib does not typecheck under TS 5.9 (decorator signatures, two GObject
# identities — a stock `ags init` project fails the same way), so errors inside /nix/store are
# filtered; every error in OUR files fails the gate (zero as of 2026-09-07).
run = [
  # stderr, not just the exit code: sass deprecations and bundler warnings do not fail `ags
  # bundle`, so three global-builtin nth() calls sat in the output for weeks (2026-09-24). Empty
  # stderr is the gate; a new deprecation is refused the day it lands, not the day 3.0.0 drops.
  "w=$(ags bundle app.tsx \"$(mktemp -d)/astal-shell\" 2>&1 >/dev/null); if [ -n \"$w\" ]; then echo \"$w\"; echo 'shell:check — bundle wrote to stderr (zero-warning rule)'; exit 1; fi; echo 'shell:check — bundle ok, stderr clean'",
  "ags types -d . -u --ignore Gtk3 --ignore Astal3 >/dev/null",
  "out=$(npx --yes -p typescript@5 tsc --noEmit -p . 2>&1 | grep -v '^ ' | grep -v '/nix/store' || true); if [ -n \"$out\" ]; then echo \"$out\"; exit 1; fi; echo 'shell:check — tsc ok'",
  # tsc does not report @deprecated, so gnim's two deprecated forms are refused by grep
  "dep=$(grep -rnE 'createComputed\\(\\s*\\[|\\.get\\(\\)' --include=*.ts --include=*.tsx --exclude-dir=node_modules --exclude-dir=@girs . || true); if [ -n \"$dep\" ]; then echo \"$dep\"; echo 'shell:check — deprecated gnim API: createComputed(() => …) not the deps array, .peek() not .get()'; exit 1; fi; echo 'shell:check — no deprecated gnim API'",
  "node --test lib/*.test.mjs",
]

["shell:test"]
description = "shell: the pure-logic tests (node --test, no gi): lib/*.test.mjs"
dir = "modules/desktop/shell"
run = "node --test lib/*.test.mjs"

["shell:restart"]
description = "shell: restart the astal-shell user unit (VM / post-cutover)"
run = "systemctl --user restart astal-shell.service"

["shell:logs"]
description = "shell: follow the astal-shell unit's journal"
run = "journalctl --user -u astal-shell.service -f"

["home:switch"]
description = "machine: apply the home-manager profile"
run = "nix run github:nix-community/home-manager -- switch --flake .#personalbox -b backup"

# Home-manager can't own a root service on Arch, so the config comes from ivysaur's services.keyd
# (the one source) and this installs it. Rerun after changing it.
["keyd:install"]
description = "machine (sudo): install keyd on Arch with the config from ivysaur's services.keyd, and retire evremap"
run = '''
set -euo pipefail
conf=$(nix build --no-link --print-out-paths '.#nixosConfigurations.ivysaur.config.environment.etc."keyd/default.conf".source')
sudo pacman -S --needed --noconfirm keyd
sudo install -Dm644 "$conf" /etc/keyd/default.conf
sudo systemctl disable --now evremap-pop evremap-internal evremap-compx-keyboard
sudo rm -f /etc/udev/rules.d/99-evremap-restart.rules
sudo systemctl enable keyd
sudo systemctl restart keyd
'''

# The one update verb (omarchy-update's shape, 2026-09-17): apply THIS checkout to the running
# machine — profile, shell, server — in the order their dependencies require. Moving the pins is a
# separate, committable step (flake:bump), not part of applying.
# The manual (docs/manual): the generated pages come from their sources, never by hand —
# keys from the live compositor, verbs from mise, the palette from render.nix. `--check` diffs.
["manual:gen"]
description = "manual: regenerate docs/manual/{keys,tasks,palette}.md from hyprctl binds, mise tasks and render.nix"
run = "scripts/manual-gen.sh"

["manual:check"]
description = "manual: fail if a generated manual page drifts from its source (run manual:gen)"
run = "scripts/manual-gen.sh --check"

["machine:update"]
description = "machine: apply the checkout to the live machine — home:switch, then restart the shell and the server"
run = [
  "mise run home:switch",
  "mise run shell:restart",
  "mise --cd {{env.HOME}}/projects/tlon run server:restart",
]
