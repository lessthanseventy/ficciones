# The repo's own loop: the gate, the names check, and the run-once/watch helpers (AGENTS.md).

["cap"]
description = "Run a command once, capture ALL output to a log, print exit + failures + tail — then read the log for more, never re-run (see AGENTS.md)"
dir = "{{cwd}}"
run = "{{config_root}}/scripts/cap.sh"

["cap:clean"]
description = "Sweep the captured run logs (.logs/) of the repo you call it from — they self-cap at CAP_KEEP (40), this clears them now"
dir = "{{cwd}}"
run = "rm -rf \"$(git rev-parse --show-toplevel)/.logs\" && echo 'swept .logs/'"

["watch"]
description = "Re-run a command on every file change, printing cap's signal — register in the background, edit, get pass/fail automatically (see AGENTS.md)"
dir = "{{cwd}}"
run = "{{config_root}}/scripts/watch.sh"

# The `[w]atchexec` bracket: `pgrep -f` matches a process's ENTIRE argv, so a naive pattern would
# match this task's own command line; `--project-origin $root` scopes it to this repo.
["watch:stop"]
description = "Stop ficciones file-watchers left running in the background (safe: never signals its own shell)"
run = '''
root="$(git rev-parse --show-toplevel)"
pids="$(pgrep -f "[w]atchexec.*--project-origin $root" || true)"
if [ -n "$pids" ]; then echo "stopping watchexec: $pids"; kill $pids; else echo "no ficciones watchers running"; fi
'''

# The seam no compiler covers: a mise task a guide names but no toml defines.
["check:names"]
description = "names-exist gate: every mise task a guide names must exist (grep, offline, fast)"
run = "scripts/check-names.sh"

["check:cap-hook"]
description = "the hook that refuses cap piped into a filter reaches every verdict it should"
run = "scripts/cap-no-pipe.test.sh"

["check:mods"]
description = "the Claude Code mods' own tests, in Claude's harness (bare bun cannot resolve claude-code/testing), their list of menard's verbs against menard's, and the review pane's copy of the diff reader against the changes pane's (a mod may import only its own files)"
run = "scripts/check-menard-verbs.sh || exit 1; cmp modules/agents/mods/changes-pane/hooks/changes.ts modules/agents/mods/review-pane/hooks/changes.ts || { echo 'check:mods — review-pane/hooks/changes.ts is a copy of changes-pane/hooks/changes.ts: edit that one, then cp it over'; exit 1; }; command -v claude >/dev/null || { echo 'check:mods — no claude on PATH, not run'; exit 0; }; for m in modules/agents/mods/*/; do claude plugin test \"$m\" || exit 1; done"

["check:agent-work"]
description = "the CLAUDE_CODE_SHELL_PREFIX wrapper runs a command intact, pinned to the E-cores"
run = "modules/agents/agent-work.test.sh"

["check:session-state"]
description = "the Claude Code hook that keeps each session's record and arena's pane mark writes what it should"
run = "modules/agents/session-state.test.sh"

# The flake builds the shell's bundle, which checks no types.
["check:shell"]
description = "the desktop shell's own gate (shell:check), where ags is installed"
run = "command -v ags >/dev/null || { echo 'check:shell — no ags on PATH, not run'; exit 0; }; mise run shell:check"

["check"]
description = "Everything green: the names gate, the cap hook, the session hook, the mods' tests, the desktop shell's gate, the manual's drift check, and the flake"
depends = ["check:names", "check:cap-hook", "check:agent-work", "check:session-state", "check:mods", "check:shell", "manual:check", "flake:check"]
