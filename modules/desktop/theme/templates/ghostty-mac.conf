
# The palette's font size is set for the Linux box's DPI; ghostty takes the last value.
font-size = 16

auto-update = download
macos-titlebar-style = hidden
# Left Option is Meta, for tmux's M-h/M-l; right Option still types special characters.
macos-option-as-alt = left
window-inherit-working-directory = true
window-new-tab-position = end
mouse-hide-while-typing = true

keybind = cmd+enter=ignore
keybind = shift+enter=text:\n

# cmd+N sends FN, which tmux binds to window N
keybind = cmd+1=text:\x1bOP
keybind = cmd+2=text:\x1bOQ
keybind = cmd+3=text:\x1bOR
keybind = cmd+4=text:\x1bOS
keybind = cmd+5=text:\x1b[15~
keybind = cmd+6=text:\x1b[17~
keybind = cmd+7=text:\x1b[18~
keybind = cmd+8=text:\x1b[19~
keybind = cmd+9=text:\x1b[20~
