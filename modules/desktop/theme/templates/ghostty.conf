
# Transparency (solid by default, Hyprland handles per-window transparency)
background-opacity = 1

# Cursor
cursor-style = bar
cursor-style-blink = false

# Padding (matching kitty's 21.75 margin)
window-padding-x = 22
window-padding-y = 22

# No close confirmation
confirm-close-surface = false

# Shell
command = zsh
shell-integration = none

# Reduce flicker on transparent windows
window-vsync = true

# Quake/dropdown terminal is handled by Hyprland (F12 -> special:quake workspace),
# not ghostty's quick-terminal — ghostty's global: keybind doesn't work under Hyprland.

# Font features (ligatures for coding)
font-feature = +calt
font-feature = +liga
font-feature = +dlig

# Keybinds
keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard
keybind = page_up=scroll_page_up
keybind = page_down=scroll_page_down
keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+equal=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+zero=reset_font_size

# Tabs
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+w=close_surface
keybind = ctrl+shift+left=previous_tab
keybind = ctrl+shift+right=next_tab
keybind = ctrl+shift+up=move_tab:-1
keybind = ctrl+shift+down=move_tab:+1

# Splits
keybind = ctrl+shift+enter=new_split:auto

# ghostty's default ctrl+enter=toggle_fullscreen eats Claude Code's
# ctrl+enter; fullscreen is Hyprland's super+shift+f
keybind = ctrl+enter=unbind
