<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        min-width: 340px;
        margin: 0;
        padding: 12px;
        background: var(--ground);
        color: var(--body);
        font-size: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        color: var(--heading);
      }
      #swatches {
        display: flex;
        gap: 4px;
        margin-bottom: 12px;
      }
      #swatches span {
        flex: 1;
        height: 12px;
        border: 1px solid var(--body);
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
      }
      input {
        accent-color: var(--body);
      }
      #host {
        color: var(--link);
        overflow-wrap: anywhere;
      }
      #note {
        color: var(--code);
      }
      [hidden] {
        display: none !important;
      }
      h2 {
        margin: 14px 0 4px;
        padding-top: 10px;
        border-top: 1px solid var(--body);
        font-size: 1em;
        color: var(--heading);
      }
      #dials label {
        display: grid;
        grid-template-columns: 7em 1fr 3em;
        gap: 8px;
        align-items: center;
      }
      #dials input {
        width: 100%;
        margin: 0;
      }
      #dials output {
        text-align: right;
      }
      button {
        padding: 4px 10px;
        background: var(--ground);
        color: var(--link);
        border: 1px solid var(--link);
        font: inherit;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        overflow-wrap: anywhere;
      }
      summary {
        margin-top: 10px;
        color: var(--link);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Ficciones</h1>
    <div id="swatches"></div>
    <label id="siteRow"><input type="checkbox" id="site" /> <span>Recolour <span id="host"></span></span></label>
    <div id="note" hidden></div>
    <label><input type="checkbox" id="all" /> Recolour all sites</label>
    <h2>Adjust</h2>
    <div id="dials"></div>
    <label id="justRow"><input type="checkbox" id="just" /> Just for this site</label>
    <button id="reset">Reset</button>
    <section id="offSection" hidden>
      <h2>Switched off</h2>
      <ul id="offList"></ul>
    </section>
    <details>
      <summary>Sites with their own theme</summary>
      <ul id="themedList"></ul>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
