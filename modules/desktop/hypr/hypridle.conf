general {
    lock_cmd       = pidof caelestia >/dev/null && caelestia shell lock lock
    before_sleep_cmd = caelestia shell lock lock
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# On AC: do nothing (no lock, no screen off, no suspend).
# On battery: lock + screen off @ 5min, suspend @ 10min.

# Battery: lock + screen off at 5 minutes
listener {
    timeout    = 300
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && { caelestia shell lock lock; hyprctl dispatch dpms off; }'
    on-resume  = hyprctl dispatch dpms on
}

# Battery: suspend at 10 minutes
listener {
    timeout    = 600
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && systemctl suspend'
}
