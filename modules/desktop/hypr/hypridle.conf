general {
    # hyprlock, once (a second lock over a lock is a hang); the shell's "awake" inhibitor holds
    # the whole chain off — on by default, so docked nothing here fires unless it is turned off
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # under the Lua config a dispatch is a Lua expression: the legacy `dpms on` is a syntax error
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5 min: lock and screen off; 10 min: suspend — on battery and on AC alike
listener {
    timeout    = 300
    on-timeout = loginctl lock-session; hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
listener {
    timeout    = 600
    on-timeout = systemctl suspend
}
