general {
    # hyprlock, once (a second lock over a lock is a hang); the shell's "awake" inhibitor holds
    # the whole chain off — on by default, so docked nothing here fires unless it is turned off
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# 5 min: lock and screen off; 10 min: suspend — on battery and on AC alike (2026-09-07)
listener {
    timeout    = 300
    on-timeout = loginctl lock-session; hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
listener {
    timeout    = 600
    on-timeout = systemctl suspend
}
