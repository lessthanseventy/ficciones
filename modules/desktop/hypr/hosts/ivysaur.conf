# ivysaur — the laptop. Hybrid Intel/NVIDIA, eDP-1 + a Samsung 27" on the dock.
# GPU selection (Intel first for battery, NVIDIA fallback)
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1

# Hybrid GPU workarounds — uncomment if stable Hyprland still hangs on page-flip.
# env = AQ_NO_MODIFIERS,1
# env = AQ_MGPU_NO_EXPLICIT,1

monitor = eDP-1,1920x1200@59.95,0x0,1
monitor = desc:Samsung Electric Company LS27D36xG,preferred,auto,auto

# Persistent workspaces (eDP-1 owns 1, external owns 2-10)
workspace = 1, monitor:eDP-1, persistent:true, default:true
workspace = 2, monitor:desc:Samsung Electric Company LS27D36xG, persistent:true, default:true
workspace = 3, monitor:desc:Samsung Electric Company LS27D36xG, persistent:true
workspace = 4, monitor:desc:Samsung Electric Company LS27D36xG, persistent:true
workspace = 5, monitor:desc:Samsung Electric Company LS27D36xG, persistent:true
workspace = 6, monitor:desc:Samsung Electric Company LS27D36xG, persistent:true
workspace = 7, monitor:desc:Samsung Electric Company LS27D36xG, persistent:true
workspace = 8, monitor:desc:Samsung Electric Company LS27D36xG, persistent:true
workspace = 9, monitor:desc:Samsung Electric Company LS27D36xG, persistent:true
workspace = 10, monitor:desc:Samsung Electric Company LS27D36xG, persistent:true
