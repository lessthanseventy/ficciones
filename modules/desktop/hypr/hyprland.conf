bind = CTRL ALT,                       Delete, exit,
bind = CTRL SHIFT ALT $mainMod,        Delete, exec, systemctl poweroff
bind = CTRL $mainMod SHIFT,            P,      dpms, off


# =============================================================================
# Conversion notes vs the old Lua config:
#
# 1. Bitwarden window-rule regex: the original had a missing ')' in the
#    alternation and used Lua's %( escape. Simplified to .*([Bb]itwarden).*
#    which still catches Floorp/Firefox extension popups containing the word.
# 2. The 'easy' spring (mass=1, stiff=71.26, damp=15.83) was approximated as
#    a bezier curve. Animations using it will feel close but not identical.
# 3. The `debug:enable_stdout_logs = true` block from the Lua is omitted —
#    only useful when debugging compositor startup.
# 4. AQ_DRM_DEVICES is kept (Intel first); AQ_NO_MODIFIERS / AQ_MGPU_NO_EXPLICIT
#    are commented stubs in case stable also has the hybrid-GPU flip issue.
# =============================================================================
