# =============================================================================
#  Hyprland configuration
#  Converted from hyprland.lua on 2026-05-12 (original kept as
#  ~/.config/hypr/hyprland.lua.disabled-2026-05-12 and ~/hyprland.lua.backup-2026-05-12)
#  Reload with: hyprctl reload
# =============================================================================


# -----------------------------------------------------------------------------
# ENVIRONMENT VARIABLES
# -----------------------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = QT_QPA_PLATFORM,wayland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

env = XDG_MENU_PREFIX,plasma-
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1

env = TERMINAL,ghostty
env = BROWSER,floorp
env = ZDOTDIR,/home/andrew
env = GHOSTTY_ZSH_ZDOTDIR,/home/andrew

env = XDG_DATA_DIRS,/home/andrew/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

# Cursor
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24

env = ILLOGICAL_IMPULSE_VIRTUAL_ENV,~/.local/state/quickshell/.venv

# Per-host lines (monitors, persistent workspaces, AQ_DRM_DEVICES) live in hosts/<host>.conf;
# home-manager links host.conf to the one named by ficciones.desktop.host. A monitor that
# does not exist is harmless, but a wrong AQ_DRM_DEVICES is a compositor that never starts.
source = ~/.config/hypr/host.conf
# Colours + the GTK theme name: generated from modules/desktop/theme/palette.nix (home-manager).
source = ~/.config/hypr/theme.conf

# -----------------------------------------------------------------------------
# AUTOSTART (was hl.on("hyprland.start", ...))
# -----------------------------------------------------------------------------
# Under uwsm (NixOS) this exports the env and activates graphical-session.target, which is
# what the shell's user unit waits on. On Arch there is no uwsm and the line is a no-op.
exec-once = command -v uwsm >/dev/null && uwsm finalize
# The astal shell (modules/desktop/shell). On NixOS the user unit starts it; on Arch there is
# no uwsm session, so exec-once does. `astal-shell` is a client when one is running, so a
# reload never doubles it.
exec-once = astal-shell
# night light daemon; the shell's hub toggles it (hyprctl hyprsunset temperature / identity)
exec-once = hyprsunset
exec-once = easyeffects --hide-window --service-mode
exec-once = hypridle
exec-once = bash -c 'wl-paste --type text  --watch cliphist store'
exec-once = bash -c 'wl-paste --type image --watch cliphist store'
exec-once = systemctl --user start hyprpolkitagent
exec-once = wgtray


# -----------------------------------------------------------------------------
# LOOK AND FEEL
# -----------------------------------------------------------------------------
general {
    gaps_in = 12
    gaps_out = 12
    border_size = 2
    # col.active_border / col.inactive_border: theme.conf
    resize_on_border = false
    allow_tearing = false
    layout = scrolling
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.15   # subtle darkening of unfocused window contents

    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 2
        color = 0x40000000
    }

    blur {
        enabled = false
    }
}

# Bezier curves (mirrors lua config — gentle, not flashy)
bezier = easeOutQuint,   0.23, 1,    0.32, 1
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = linear,         0,    0,    1,    1
bezier = almostLinear,   0.5,  0.5,  0.75, 1
bezier = quick,          0.15, 0,    0.1,  1
# 'easy' was a spring(mass=1, stiffness=71.26, dampening=15.83) in Lua —
# bezier approximation here (slight overshoot for spring-feel)
bezier = easy,           0.05, 0.9,  0.1,  1.05

animations {
    enabled = yes
    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easy
    animation = windowsIn,     1, 4.1,  easy,         popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


# -----------------------------------------------------------------------------
# SCROLLING LAYOUT (niri-like)
# -----------------------------------------------------------------------------
scrolling {
    # A lone column ignores column_width and takes the full usable width.
    fullscreen_on_one_column = true

    # 0.8 of 1844px usable (1920 - 64 rail - 12 margin) = ~1475px focused,
    # leaving the neighbour ~369px of deliberate peek. Two columns no longer tile flush.
    column_width = 0.8

    # colresize +conf/-conf (Super+R / Super+Shift+R) steps this ladder; it must contain
    # column_width or the first press jumps straight to the smallest entry.
    explicit_column_widths = 0.33333,0.5,0.66667,0.8,1.0

    # 0 centres the focused column. 1 scrolls the minimum needed to reveal it, which parks
    # a newly-revealed column flush against the screen edge as a sliver.
    focus_fit_method = 0

    follow_focus = true
    wrap_focus = false
}


# -----------------------------------------------------------------------------
# MISC
# -----------------------------------------------------------------------------
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = false
    vrr = 2   # fullscreen-only VRR (was 1 = always-on); avoids desktop flicker on the mixed-refresh dual-monitor setup
}

# Let fullscreen apps (video, games) bypass compositing and go straight to the
# display plane — skips the i915 composite+flip path. Added 2026-07-02.
render {
    direct_scanout = 1
}

# Never warp the pointer on focus change (Andrew, 2026-09-05).
cursor {
    no_warps = true
    warp_on_change_workspace = false
}

binds {
    allow_workspace_cycles = false
    workspace_back_and_forth = false
    movefocus_cycles_fullscreen = false
    movefocus_cycles_groupfirst = false
}


# -----------------------------------------------------------------------------
# INPUT
# -----------------------------------------------------------------------------
input {
    kb_layout = us
    repeat_delay = 250
    repeat_rate = 35
    numlock_by_default = true
    follow_mouse = 0
    sensitivity = 0

    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# 3-finger swipe gestures (up/down = workspaces, left/right = focus)
gesture = 3, up,    dispatcher, workspace, r-1
gesture = 3, down,  dispatcher, workspace, r+1
gesture = 3, left,  dispatcher, layoutmsg, focus l
gesture = 3, right, dispatcher, layoutmsg, focus r


# -----------------------------------------------------------------------------
# WINDOW RULES
# -----------------------------------------------------------------------------

# Suppress maximize events
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# Fix XWayland phantom drag windows
windowrule {
    name = no-focus-phantom
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Default opacity (every window starts at 1.0)
windowrule {
    name = default-opacity
    match:class = .*
    opacity = 1
}

# Floating utilities
windowrule {
    name = float-utils
    match:class = ^(blueberry\.py|guifetch|pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|blueman-manager|org\.freedesktop\.impl\.portal\.desktop\.kde)$
    float = true
}

# File dialogs
windowrule {
    name = float-dialogs
    match:title = ^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|Library|File Upload).*
    float = true
}

# Picture-in-picture
windowrule {
    name = pip-float-pin
    match:title = ^[Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture
    float = true
    pin = true
}

# fzf-picker
windowrule {
    name = fzf-picker
    match:class = ^(fzf-picker)$
    float = true
    size = 800 600
}

# Quake dropdown terminal: ghostty (class com.ghostty.quake) on the special:quake
# workspace, toggled globally by F12. quake-toggle.sh sizes/positions it as a
# full-width top band on the focused monitor (dual-monitor safe), so only float here.
windowrule {
    name = quake-term
    match:class = ^(com\.ghostty\.quake)$
    float = true
}

# Bitwarden popups
windowrule {
    name = bitwarden-popup
    match:title = .*([Bb]itwarden).*
    float = true
    size = 500 700
    center = true
}

# Zoom (XWayland, v7.x). Canonical fixes: github.com/hyprwm/Hyprland/issues/4809
# All Zoom windows are class=zoom; we distinguish by title. Community consensus:
#   - float everything, tile only the main app + meeting window
#   - use `no_initial_focus` (NOT the aggressive `stay_focused`) so transient
#     popups/toolbars don't steal focus or vanish when the mouse moves
#   - `move = onscreen cursor` so dropdowns open at the pointer, not center-screen
# Captured titles (zoom 7.0.5, all class=zoom, xwayland): Meeting, Zoom Workplace*,
#   *Zoom Meeting, menu window, Toolbar Menu, Meeting security, Meeting info,
#   confirm window, annotate_toolbar (re-spawns continuously), share picker.

# 1. Float every Zoom window by default (popups/dropdowns/toolbars need this)...
windowrule {
    name = zoom-float-default
    match:class = ^(zoom)$
    float = true
}
# 2. ...but TILE only the meeting window. NB: do NOT tile "Zoom Workplace" — the
#    chat panel shares that exact title with the home window, so tiling it wedges
#    the chat into the layout. Home + chat just float; only the meeting tiles.
windowrule {
    name = zoom-tile-meeting
    match:class = ^(zoom)$
    match:title = .*Zoom Meeting$
    tile = true
}
windowrule {
    name = zoom-tile-meeting-bare
    match:class = ^(zoom)$
    match:title = ^Meeting$
    tile = true
}
# 3. Dropdowns / menus / panels: don't grab focus (stops vanish-on-mouse-move and
#    focus yank), and open them at the cursor instead of dumped center-screen.
windowrule {
    name = zoom-popups-noinitialfocus
    match:class = ^(zoom)$
    match:title = ^(menu window|Toolbar Menu|Meeting security|Meeting info|confirm window)$
    no_initial_focus = true
}
windowrule {
    name = zoom-popups-atcursor
    match:class = ^(zoom)$
    match:title = ^(menu window|Toolbar Menu)$
    move = onscreen cursor
}
# 4. Annotation / screen-share toolbar: Zoom re-spawns it many times a second, so it
#    must never grab focus; float + pin so it stays put across the meeting.
windowrule {
    name = zoom-toolbars
    match:class = ^(zoom)$
    match:title = ^(annotate_toolbar|as_toolbar)$
    no_initial_focus = true
    pin = true
    border_size = 0
    rounding = 0
    no_shadow = true
}
# 5. Screen-share source picker: center it.
windowrule {
    name = zoom-share-picker-center
    match:class = ^(zoom)$
    match:title = ^Select a window or an application.*
    center = true
}

# EmulationStation fullscreen
windowrule {
    name = es-fullscreen
    match:class = ^(emulationstation|EmulationStation|es-de|emulationstation-de)$
    fullscreen = true
    opacity = 1.0
}

# Immediate (no vsync) for games / wine .exe windows
windowrule {
    name = wine-no-vsync
    match:title = .*\.exe
    immediate = true
}


